<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2430"/>
      <stop offset="100%" stop-color="#101216"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#005a9e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base App Tile Background -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Left Snap Tile (Accent Blue) -->
  <rect x="22" y="24" width="38" height="80" rx="6" fill="url(#accent)"/>
  <rect x="22.5" y="24.5" width="37" height="79" rx="5.5" fill="none" stroke="#60cdff" stroke-width="1.2"/>

  <!-- Top Right Snap Tile -->
  <rect x="66" y="24" width="40" height="37" rx="6" fill="#ffffff" fill-opacity="0.18"/>
  <rect x="66.5" y="24.5" width="39" height="36" rx="5.5" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Bottom Right Snap Tile -->
  <rect x="66" y="67" width="40" height="37" rx="6" fill="#ffffff" fill-opacity="0.18"/>
  <rect x="66.5" y="67.5" width="39" height="36" rx="5.5" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
</svg>
